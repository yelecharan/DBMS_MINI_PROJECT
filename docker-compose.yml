services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatesentry_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/sql/01_schema_ddl.sql:/docker-entrypoint-initdb.d/01_schema_ddl.sql:ro
      - ./backend/database/sql/02_functions.sql:/docker-entrypoint-initdb.d/02_functions.sql:ro
      - ./backend/database/sql/03_procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./backend/database/sql/04_triggers.sql:/docker-entrypoint-initdb.d/04_triggers.sql:ro
      - ./backend/database/sql/05_roles_permissions.sql:/docker-entrypoint-initdb.d/05_roles_permissions.sql:ro
      - ./backend/database/sql/06_runtime_roles.sql:/docker-entrypoint-initdb.d/06_runtime_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gatesentry_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://gatesentry_app:${APP_DB_PASSWORD}@postgres:5432/gatesentry_db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: incident_embeddings
      HF_HOME: /opt/huggingface
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:?Set DETECTOR_API_KEY in .env}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/opt/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  outbox-worker:
    build: ./backend
    command: ["python", "-m", "app.workers.outbox_worker"]
    environment:
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://gatesentry_worker:${WORKER_DB_PASSWORD}@postgres:5432/gatesentry_db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: incident_embeddings
      HF_HOME: /opt/huggingface
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:?Set DETECTOR_API_KEY in .env}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
    volumes:
      - model_cache:/opt/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
